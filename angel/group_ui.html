<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Angel · 机器人群聊</title>
<style>
:root{color-scheme:light dark;--bg:#F3F5F4;--surface:#FFFFFF;--panel:#E9EDEA;--line:#DEE3DE;--text:#2A2D34;--muted:#6E7278;--primary:#5F7D5C;--accent:#6B8CAE;--warm:#E07856;--ok:#4C9A6C;--bad:#C24B42}
@media (prefers-color-scheme:dark){:root{--bg:#1F2420;--surface:#2E342E;--panel:#262B26;--line:#3A4038;--text:#E9EDEA;--muted:#9AA39B;--primary:#7FA07B;--accent:#8FA8C4;--warm:#E07856;--ok:#6BB98A;--bad:#E0786B}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line)}
header strong{font-size:19px;color:var(--text);display:flex;align-items:center;gap:10px}
header strong img{width:32px;height:32px;border-radius:50%;object-fit:cover}
header a{color:var(--muted);text-decoration:none}
main{height:calc(100vh - 64px);display:grid;grid-template-columns:245px minmax(300px,1fr) 260px}
aside{padding:20px;border-right:1px solid var(--line);overflow:auto}
aside:last-child{border-left:1px solid var(--line);border-right:0}
section{min-width:0;display:flex;flex-direction:column}
h2{font-size:16px;margin:0 0 14px}h3{font-size:14px;margin:14px 0 4px}
button,input,select,textarea{font:inherit;border-radius:9px}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 13px}
button:hover{border-color:var(--primary)}button:disabled{opacity:.45;cursor:wait}
.primary{background:var(--primary);border:0;color:#fff;font-weight:700}
input,select,textarea{background:var(--surface);color:var(--text);border:1px solid var(--line);padding:10px;min-width:0}
input:focus,textarea:focus{outline:2px solid var(--accent)}
.room{display:block;width:100%;text-align:left;margin:6px 0}
.room.active{border-color:var(--primary);background:var(--panel)}
.muted{color:var(--muted);font-size:12px}
#roomTitle{padding:14px 20px;border-bottom:1px solid var(--line);font-size:17px;font-weight:650}
#messages{padding:20px;overflow-y:auto;flex:1}
.message{padding:12px 15px;margin-bottom:12px;border:1px solid var(--line);border-radius:12px;max-width:860px;background:var(--surface)}
.message.user{margin-left:auto;background:var(--panel)}
.message.error{border-color:var(--bad)}
.speaker{font-weight:700;color:var(--primary);margin-bottom:5px}
.content{white-space:pre-wrap;overflow-wrap:anywhere}
#composer{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
#messageInput{flex:1;min-height:44px;resize:vertical;max-height:150px}
.member{padding:12px;margin:8px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.member b{color:var(--primary)}.member p{margin:4px 0}
dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:16px;max-width:650px;width:min(92vw,650px);max-height:85vh;overflow:auto;padding:24px}
dialog::backdrop{background:#000a}
.field{display:grid;gap:5px;margin:12px 0}.field input{width:100%}
.row{display:flex;gap:9px;align-items:center}
#botFields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.botfield{background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:10px}
.botfield input{width:100%;margin-top:5px}
#status{min-height:18px;color:var(--muted);padding:0 20px 8px}
@media(max-width:850px){main{grid-template-columns:175px 1fr}aside:last-child{display:none}aside{padding:12px}}
@media(max-width:540px){main{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside:first-child{padding:10px;display:flex;gap:8px;align-items:center;overflow:auto;border-bottom:1px solid var(--line);border-right:0}aside:first-child h2{display:none}#rooms{display:flex;gap:6px;overflow-x:auto}#rooms button{white-space:nowrap}#composer{flex-wrap:wrap}#messageInput{width:100%;flex-basis:100%}}
</style>
</head>

<main>
<aside>
<h2>我的机器人群</h2>
<button class="primary" id="newRoom">＋ 新建群</button>
<div id="rooms"></div>
<p class="muted">每个机器人有独立的身份、会话、记忆和工作目录。</p>
</aside>
<section>
<div id="roomTitle">请选择一个群，或创建新群</div>
<div id="messages" aria-live="polite"></div>
<div id="status" role="status"></div>
<form id="composer" style="display:none">
<textarea id="messageInput" required maxlength="6000" placeholder="交给所有机器人讨论，或用 @architect 指定一位成员"></textarea>
<select id="rounds" aria-label="讨论轮数"><option value="1">1 轮</option><option value="2">2 轮</option></select>
<button class="primary" type="submit" id="sendBtn">发送</button>
</form>
</section>
<aside><h2>群成员</h2><div id="members"></div><p class="muted">默认只读。一次请求最多 2 轮，每位机器人的轮次有上限；模型调用可能计费。</p></aside>
</main>
<dialog id="newDialog">
<form id="createForm">
<h2>创建独立机器人群</h2>
<div class="field"><label for="newName">群名称</label><input id="newName" required maxlength="100" value="Angel 开发团队"></div>
<div class="field"><label for="newId">群 ID（英文小写，无空格）</label><input id="newId" required pattern="[a-z][a-z0-9_-]{0,31}" value="dev-team"></div>
<p class="muted">为每个机器人选择模型提供商和模型 ID（留空即使用 Angel 当前默认设置）。所有成员初始为只读，防止自动执行危险操作。</p>
<div id="botFields"></div>
<div class="row" style="justify-content:flex-end;margin-top:18px">
<button type="button" id="cancelCreate">取消</button><button class="primary" type="submit">创建群</button>
</div>
</form>
</dialog>
<script src="/group-ui.js"></script>
</body>
