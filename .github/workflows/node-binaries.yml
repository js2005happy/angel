# Node 单文件可执行：构建 5 个平台产物 + 跨平台冒烟验证。
#
# 触发：v* 标签（发 Release）、改到 Node 源码/构建脚本的 PR、手动。
# 流程：ubuntu-latest 上用 Bun 一次编出 5 个产物（Bun --compile 交叉编译，
# 第 0 阶段已验证格式）；随后 windows-latest 与 macos-latest 各下一个
# 对应产物跑 --version / --example 冒烟（真机运行验证，不是只看格式）。
# Release 只在打 v* 标签时创建，二进制挂为 Release 附件，不进 git。
# 代码签名是条件式的（见 docs/SIGNING.md）：WINDOWS_CERTIFICATE 秘密
# 存在时，构建后用 osslsigncode 给 nyra-windows-x64.exe 做 Authenticode
# 签名；秘密不存在时整步跳过，产物保持未签名。macOS 的 Node 二进制目前
# 不签名（裸 Mach-O 文件，见 docs/SIGNING.md 的说明），桌面端 .app/.dmg
# 的签名走 desktop.yml。
# 本 workflow 只验证“能跑”，签名状态见 docs/SIGNING.md。

name: Node binaries

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/node/**'
      - 'scripts/build-binaries.sh'
      - 'scripts/build-package-node.sh'
      - 'scripts/install-node.sh'
      - 'scripts/probes/**'
      - 'package.json'
      - '.github/workflows/node-binaries.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/node/**'
      - 'scripts/build-binaries.sh'
      - 'scripts/probes/**'
      - 'package.json'
      - '.github/workflows/node-binaries.yml'
  workflow_dispatch:

permissions:
  contents: write # 发 Release 时需要；平时只读构建不受影响

concurrency:
  group: node-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 5 binaries (ubuntu-latest / Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 签名秘密先映射到 job 级 env：GitHub 不允许在 `if:` 里直接引用 secrets
    #（官方文档：“Secrets cannot be directly referenced in `if:` conditionals.
    # Instead, consider setting secrets as job-level environment variables,
    # then referencing the environment variables to conditionally run steps.”），
    #所以步骤的条件判断一律读 env.*。秘密只在这里出现一次，各步骤沿用。
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Run Node tests
        run: bun test tests/node

      - name: Run Bun API probes
        run: bash scripts/run-probes.sh

      - name: Build binaries
        run: bash scripts/build-binaries.sh

      # --- 条件签名接线（docs/SIGNING.md） ---------------------------------
      # 只有 WINDOWS_CERTIFICATE 秘密存在时才跑；不存在时整步跳过，
      # nyra-windows-x64.exe 保持未签名。秘密只配了一半时里面直接报错退出，
      # 绝不悄悄出未签名包。Linux 上用 osslsigncode 做 Authenticode 签名
      # （与 Windows signtool 同一种签名，时间戳用 DigiCert 的 RFC 3161 服务）。
      - name: Sign Windows binary with OV certificate (optional)
        if: env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$WINDOWS_CERTIFICATE_PASSWORD" ]; then echo "::error::WINDOWS_CERTIFICATE 已配置，但 WINDOWS_CERTIFICATE_PASSWORD 为空"; exit 1; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode
          echo "$WINDOWS_CERTIFICATE" | base64 -d > /tmp/nyra-sign.pfx
          # osslsigncode 不能原地覆盖：先签到临时文件再换回来。
          osslsigncode sign -pkcs12 /tmp/nyra-sign.pfx -pass "$WINDOWS_CERTIFICATE_PASSWORD" \
            -h sha256 -ts http://timestamp.digicert.com \
            -in dist/nyra-windows-x64.exe -out /tmp/nyra-windows-x64-signed.exe
          mv /tmp/nyra-windows-x64-signed.exe dist/nyra-windows-x64.exe
          rm -f /tmp/nyra-sign.pfx
          osslsigncode verify -in dist/nyra-windows-x64.exe
          echo "Windows binary signed."

      - name: Check formats
        run: file dist/*

      - name: Smoke test (Linux)
        run: |
          export NYRA_HOME="$RUNNER_TEMP/.nyra"
          ./dist/nyra-linux-x64 --version
          ./dist/nyra-linux-x64 --help | head -5
          ./dist/nyra-linux-x64 --example

      # install-node.sh 与 build-package-node.sh 以前没有任何自动化测试：
      # 只在隔离 HOME 里跑 --from-file 安装与打包冒烟，不联网下载。
      - name: Smoke test install script (Linux, --from-file)
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          mkdir -p "$HOME"
          bash scripts/install-node.sh --from-file dist/nyra-linux-x64 \
            --prefix "$RUNNER_TEMP/nyra-install" --bin-dir "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/nyra" --version
          "$RUNNER_TEMP/bin/nyra" --example

      - name: Smoke test Node packaging
        run: |
          bash scripts/build-package-node.sh --binary dist/nyra-linux-x64 \
            --out-dir "$RUNNER_TEMP/pkg-out"
          ls "$RUNNER_TEMP/pkg-out"/nyra-node-*.tar.gz
          ls "$RUNNER_TEMP/pkg-out"/nyra-node_*.deb

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: nyra-binaries
          path: dist/*
          if-no-files-found: error

  verify-windows:
    name: Smoke test nyra.exe (windows-latest)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: nyra-binaries
          path: binaries

      - name: Smoke test
        shell: pwsh
        run: |
          $env:NYRA_HOME = Join-Path $env:RUNNER_TEMP ".nyra"
          .\binaries\nyra-windows-x64.exe --version
          .\binaries\nyra-windows-x64.exe --help | Select-Object -First 5
          .\binaries\nyra-windows-x64.exe --example

  verify-macos:
    name: Smoke test macOS binary (macos-latest)
    needs: build
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: nyra-binaries
          path: binaries

      - name: Smoke test
        run: |
          arch="$(uname -m)"
          if [ "$arch" = "arm64" ]; then bin="binaries/nyra-macos-arm64"; else bin="binaries/nyra-macos-x64"; fi
          chmod +x "$bin"
          export NYRA_HOME="$RUNNER_TEMP/.nyra"
          "$bin" --version
          "$bin" --help | head -5
          "$bin" --example

  release:
    name: Attach binaries to GitHub Release
    needs: [build, verify-windows, verify-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: nyra-binaries
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: false # 0.4.1 起是正式版，不再标预发布
          generate_release_notes: true
          body: |
            Nyra Node 运行时：单文件可执行（Bun --compile）。
            下载对应平台的文件，给执行权限，直接运行；首次使用跑 `nyra setup`。
            代码签名：见 docs/SIGNING.md。证书配置后构建即自动签名（Windows 命令行版与桌面安装包、macOS 桌面安装包）；未配置证书时产物未签名、未公证，Windows SmartScreen 与 macOS Gatekeeper 的首次运行提示仍存在（见安装文档）。
