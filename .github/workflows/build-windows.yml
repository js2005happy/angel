# Build the Windows one-file exe on a real Windows runner.
#
# Why CI builds it: PyInstaller can only build for the machine it runs on,
# so no Linux/macOS machine can produce nyra.exe. This workflow runs the
# full test suite on windows-latest first, then builds the exe with
# PyInstaller and uploads it as a workflow artifact on every main push.
# Nothing is published to a GitHub Release on plain pushes; a Release is
# created only when a version tag (v*) is pushed.
#
# The exe is a plain console app (no installer, no admin rights): download
# nyra.exe, put it somewhere on PATH, set a model key, run `nyra`.
# First real Windows run of the exe happens here, in this workflow's
# smoke test (`nyra.exe --version`); it has never been run on a
# developer's Windows machine.

name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build nyra.exe (windows-latest / Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path nyra/__init__.py -Pattern '__version__ = "(.*)"').Matches.Groups[1].Value
          if (-not $version) { throw "could not read __version__ from nyra/__init__.py" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Compile Python sources
        run: python -m compileall -q nyra tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build one-file exe
        # --paths . lets PyInstaller resolve the top-level `nyra` package
        # from nyra/__main__.py. The --add-data entries are files Nyra
        # reads at runtime next to its own code (webui.py serves them):
        #   group-ui.js / group_ui.html  (group chat page)
        #   skills/*.md                  (built-in skills, repo-root dir)
        #   docs/assets/nyra-mark.svg    (PWA icon; the route 404s
        #                                 gracefully when it is absent)
        # Windows --add-data separator is ';' (quoted so pwsh keeps it
        # as one argument). No hidden imports: the codebase is stdlib
        # only and has no dynamic imports (verified by grep).
        run: |
          pyinstaller --onefile --name nyra --console --clean --noconfirm `
            --paths . `
            --add-data "nyra/group-ui.js;nyra" `
            --add-data "nyra/group_ui.html;nyra" `
            --add-data "skills;skills" `
            --add-data "docs/assets/nyra-mark.svg;docs/assets" `
            nyra/__main__.py

      - name: Smoke test the exe
        shell: pwsh
        run: |
          .\dist\nyra.exe --version
          if ($LASTEXITCODE -ne 0) { throw "nyra.exe --version failed" }

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyra-${{ steps.version.outputs.version }}-windows-x86_64
          path: dist/nyra.exe
          if-no-files-found: error
          retention-days: 90

  release:
    name: Attach exe to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          pattern: nyra-*-windows-x86_64
          path: dist
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nyra.exe
          generate_release_notes: true
