# Build the Nyra desktop app (Tauri shell in desktop/) for macOS and Windows.
#
# Runs only by hand (Actions → "Build desktop app" → Run workflow) or when a
# version tag (v*) is pushed, so it never slows down normal pushes / PRs.
# Output is uploaded as workflow artifacts only; nothing is published to a
# GitHub Release here.
#
# The installers are NOT signed (no Apple Developer ID / Windows code-signing
# certificate yet). macOS builds get the standard ad-hoc signature only
# (signingIdentity "-"), which is not a developer identity and is not
# notarized. See docs/desktop.md for how users open them.
#
# The app does not bundle Python: it starts `nyra ui` with the user's own
# Python 3.10+ (or nyra.exe on PATH) and shows a guide page if none is found.

name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin --bundles app,dmg
            bundle_dir: desktop/src-tauri/target/universal-apple-darwin/release/bundle
            artifact: Nyra-macos-universal
            files: |
              desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows (x64)
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: --bundles msi,nsis
            bundle_dir: desktop/src-tauri/target/release/bundle
            artifact: Nyra-windows-x64
            files: |
              desktop/src-tauri/target/release/bundle/msi/*.msi
              desktop/src-tauri/target/release/bundle/nsis/*.exe
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check versions match nyra/__init__.py
        run: |
          py=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' nyra/__init__.py)
          conf=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/src-tauri/Cargo.toml | head -1)
          echo "nyra=$py tauri.conf=$conf Cargo.toml=$cargo"
          if [ "$py" != "$conf" ] || [ "$py" != "$cargo" ]; then
            echo "::error::desktop version must match nyra/__init__.py ($py)"; exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Rust unit tests
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Build installers
        working-directory: desktop
        run: npx tauri build ${{ matrix.tauri_args }}

      - name: List bundles
        run: find "${{ matrix.bundle_dir }}" -maxdepth 2 -type f -exec ls -l {} \;

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
