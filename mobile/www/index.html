<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nyra</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0B0B0C; color: #F5F5F7;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 48px 20px 32px;
  }
  .mark { width: 72px; height: 72px; }
  h1 { font-size: 28px; margin: 16px 0 4px; letter-spacing: 2px; }
  .sub { color: #9a9aa0; font-size: 14px; margin: 0 0 28px; }
  .card {
    width: 100%; max-width: 420px; background: #17171a; border: 1px solid #26262b;
    border-radius: 16px; padding: 20px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: #EAC45F; }
  label { display: block; font-size: 13px; color: #9a9aa0; margin: 12px 0 6px; }
  input {
    width: 100%; background: #0B0B0C; border: 1px solid #33333a; color: #F5F5F7;
    border-radius: 10px; padding: 12px 14px; font-size: 16px; outline: none;
  }
  input:focus { border-color: #EAC45F; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button {
    width: 100%; margin-top: 20px; padding: 14px; border: none; border-radius: 12px;
    background: #EAC45F; color: #0B0B0C; font-size: 17px; font-weight: 700; cursor: pointer;
  }
  button.secondary { background: transparent; border: 1px solid #33333a; color: #F5F5F7; font-weight: 400; }
  .err { color: #ff7a7a; font-size: 13px; min-height: 18px; margin-top: 10px; }
  ol { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.9; color: #cfcfd4; }
  code { background: #0B0B0C; border: 1px solid #33333a; border-radius: 6px; padding: 1px 6px; font-size: 13px; }
  .note { width: 100%; max-width: 420px; font-size: 12px; line-height: 1.7; color: #77777e; }
  .hidden { display: none; }
</style>
</head>
<body>
<svg class="mark" viewBox="6 6 88 88" aria-hidden="true"><path fill="#F5F5F7" fill-rule="evenodd" d="M10 50 A40 40 0 1 0 90 50 A40 40 0 1 0 10 50 Z M39.93 29.80 A3 3 0 0 0 35.09 32.46 L39.76 76.94 A3 3 0 0 0 44.99 78.61 L51.92 70.74 L58.75 82.25 A3 3 0 0 0 62.84 83.32 L69.77 79.30 A3 3 0 0 0 70.84 75.17 L64.32 64.23 L73.76 63.24 A3 3 0 0 0 75.32 57.91 Z"/></svg>
<h1>Nyra</h1>
<p class="sub">连上电脑上的 Nyra</p>

<div class="card hidden" id="quickCard">
  <h2>上次连过的电脑</h2>
  <div id="quickText" style="font-size:15px"></div>
  <button class="secondary" id="quickBtn">直接打开</button>
</div>

<div class="card">
  <h2>连接电脑</h2>
  <label for="host">电脑地址（局域网 IP 或主机名）</label>
  <input id="host" type="text" inputmode="url" autocomplete="off" placeholder="例如 192.168.1.23">
  <div class="row">
    <div>
      <label for="port">端口</label>
      <input id="port" type="number" inputmode="numeric" value="8765" min="1" max="65535">
    </div>
    <div>
      <label for="code">配对码（可选，6 位）</label>
      <input id="code" type="text" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="首次连接时填">
    </div>
  </div>
  <div class="err" id="err"></div>
  <button id="connectBtn">连接</button>
</div>

<div class="card">
  <h2>怎么用</h2>
  <ol>
    <li>电脑上跑 <code>nyra ui --pair</code>，终端里会打印二维码和 6 位配对码。</li>
    <li>手机和电脑连<strong>同一个 Wi-Fi</strong>。</li>
    <li>上面填电脑地址（终端里打印的那串 IP）和配对码，点连接。</li>
    <li>配对成功后这台手机就记住了，下次直接打开就行；配对码 5 分钟有效、只能用一次。</li>
  </ol>
</div>

<p class="note">Nyra 的工具仍在电脑上执行，手机只是遥控器。传输是明文 HTTP，只在自己信任的家庭 Wi-Fi 里用，绝不要把端口映射到公网。手机丢了，第一时间在电脑的设置 → 手机里撤销。</p>

<script>
(function () {
  var hostEl = document.getElementById('host');
  var portEl = document.getElementById('port');
  var codeEl = document.getElementById('code');
  var errEl = document.getElementById('err');
  var last = null;
  try { last = JSON.parse(localStorage.getItem('nyra-last-gateway') || 'null'); } catch (e) {}
  if (last && last.host) {
    hostEl.value = last.host;
    if (last.port) portEl.value = last.port;
    document.getElementById('quickText').textContent = last.host + ':' + (last.port || 8765);
    document.getElementById('quickCard').classList.remove('hidden');
    document.getElementById('quickBtn').onclick = function () { go(last.host, last.port || 8765, ''); };
  }
  function go(host, port, code) {
    host = (host || '').trim().replace(/^https?:\/\//i, '').split('/')[0];
    if (!host) { errEl.textContent = '先填电脑地址。'; return; }
    if (!/^[A-Za-z0-9._-]+(:\d+)?$/.test(host)) { errEl.textContent = '电脑地址格式不对，只要 IP 或主机名，不要带 http://。'; return; }
    port = parseInt(port, 10);
    if (!port || port < 1 || port > 65535) { errEl.textContent = '端口不对，应在 1–65535 之间。'; return; }
    code = (code || '').trim();
    if (code && !/^\d{6}$/.test(code)) { errEl.textContent = '配对码是 6 位数字，不填也可以（已配对过的手机不用填）。'; return; }
    try { localStorage.setItem('nyra-last-gateway', JSON.stringify({ host: host, port: port })); } catch (e) {}
    var url = 'http://' + host + ':' + port + '/m' + (code ? '#pair=' + code : '');
    window.location.href = url;
  }
  document.getElementById('connectBtn').onclick = function () {
    errEl.textContent = '';
    go(hostEl.value, portEl.value, codeEl.value);
  };
})();
</script>
</body>
</html>
